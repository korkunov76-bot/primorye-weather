<!doctype html><html lang="ru"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Погода Приморья</title>
<style>
:root{--bg:#0c1a24;--card:#13293a;--line:#234259;--tx:#e6f0f5;--mut:#8aa6b8;--ac:#58c4d4;--warn:#f0a65c;--bad:#ee6c68}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.4 Roboto,"Segoe UI",sans-serif;padding:0 12px 28px}
header{display:flex;align-items:center;justify-content:space-between;padding:12px 0 6px}
h1{font-size:20px;margin:0}h2{font-size:16px;margin:0 0 8px;color:var(--ac)}
section{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:12px;margin:10px 0;overflow-x:auto}
button,select,input{font:inherit;color:var(--tx);background:#0e2231;border:1px solid var(--line);border-radius:8px;padding:6px 10px}
button.on{background:var(--ac);color:#04202a;border-color:var(--ac)}
.row{display:flex;gap:6px;flex-wrap:wrap;margin:6px 0}
.big{font-size:52px;font-weight:300;line-height:1}
.mut{color:var(--mut);font-size:13px}
table{border-collapse:collapse;width:100%;font-size:14px}
td,th{padding:5px 6px;text-align:left;border-bottom:1px solid var(--line);white-space:nowrap}
th{color:var(--mut);font-weight:400}
.warn{color:var(--warn)}.bad{color:var(--bad)}
.alert{border-left:4px solid var(--warn);padding:6px 10px;margin:6px 0;background:#2a2218;border-radius:4px}
.alert.bad{border-color:var(--bad);background:#2c1b1b;color:var(--tx)}
.kp{display:flex;align-items:flex-end;gap:3px;height:70px;margin:6px 0}
.kp i{flex:1;background:var(--ac);border-radius:3px 3px 0 0;min-width:8px}
.kp i.warn{background:var(--warn)}.kp i.bad{background:var(--bad)}
#ov{position:fixed;inset:0;background:#000a;display:none;z-index:9}
#ov.show{display:block}
#dlg{background:var(--card);margin:max(24px,env(safe-area-inset-top)) 12px;padding:14px;border-radius:12px;max-height:88%;overflow:auto}
#dlg label{display:flex;justify-content:space-between;align-items:center;gap:8px;margin:10px 0}
#dlg button{margin:4px 4px 4px 0}
</style></head><body>
<header><h1 id="ttl"></h1><button id="gear" aria-label="Настройки">Настройки</button></header>
<div class="row" id="locs"></div>
<div class="mut" id="st">Загрузка…</div>
<div id="app"></div>
<div class="mut" style="margin-top:14px">Данные: Open-Meteo, MET Norway, NOAA SWPC.</div>
<div id="ov"><div id="dlg"></div></div>
<script>
const PAGE_V=22;
const $=s=>document.querySelector(s);
const LOCS={vl:{n:'Владивосток',lat:43.1155,lon:131.8855},terney:{n:'Терней',lat:45.05,lon:136.62},trio:{n:'Бухта Триозерье',lat:44.65,lon:135.45}};
const q=new URLSearchParams(location.search);const LK=LOCS[q.get('loc')]?q.get('loc'):'vl';const L=LOCS[LK];
const ls={g(k,d){try{const v=JSON.parse(localStorage.getItem(k));return v==null?d:v}catch(e){return d}},s(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}};
let cfg=Object.assign({src:'met',warn:true,thr:15,ne:true,nh:7,nm:30},ls.g('cfg',{}));
const B=window.AndroidBridge||null;
// ---- сеть
const cbs={};let cid=0;
window.__cb=(id,ok,txt)=>{const c=cbs[id];if(!c)return;delete cbs[id];ok?c.res(txt):c.rej(new Error(txt))};
function get(url){return new Promise((res,rej)=>{
 function f(){const c=new AbortController(),t=setTimeout(()=>c.abort(),9000);
  fetch(url,{signal:c.signal}).then(r=>{if(!r.ok)throw new Error(r.status);return r.text()}).then(res,rej).finally(()=>clearTimeout(t))}
 if(B&&B.httpGet){const id=++cid;cbs[id]={res,rej};try{B.httpGet(url,id)}catch(e){delete cbs[id];f()}}else f()}).then(JSON.parse)}
// ---- утилиты
const lt=d=>new Date(d.getTime()+36e5*10);
const hh=d=>String(lt(d).getUTCHours()).padStart(2,'0');
const dk=d=>lt(d).toISOString().slice(0,10);
const DOW=['вс','пн','вт','ср','чт','пт','сб'];
const dl=d=>{const x=lt(d);return DOW[x.getUTCDay()]+' '+x.getUTCDate()+'.'+String(x.getUTCMonth()+1).padStart(2,'0')};
const dirT=d=>d==null?'':['С','СВ','В','ЮВ','Ю','ЮЗ','З','СЗ'][Math.round(d/45)%8];
const r=(v,n=0)=>v==null?'–':v.toFixed(n);
const mean=a=>a.length?a.reduce((x,y)=>x+y,0)/a.length:null;
function trim(a){a=a.slice().sort((x,y)=>x-y);if(a.length>=5)a=a.slice(1,-1);return mean(a)}
function cmean(a){if(!a.length)return null;let s=0,c=0;a.forEach(d=>{s+=Math.sin(d*Math.PI/180);c+=Math.cos(d*Math.PI/180)});return(Math.atan2(s,c)*180/Math.PI+360)%360}
function mode(a){const m={};let b=null,n=0;a.forEach(x=>{m[x]=(m[x]||0)+1;if(m[x]>n){n=m[x];b=x}});return b}
function cond(x){if(x==null)return'–';
 if(typeof x==='number'){if(x===0)return'Ясно';if(x===1)return'Малооблачно';if(x===2)return'Перем. облачность';if(x===3)return'Пасмурно';if(x===45||x===48)return'Туман';if(x>=51&&x<=57)return'Морось';if((x>=61&&x<=67)||(x>=80&&x<=82))return'Дождь';if((x>=71&&x<=77)||x===85||x===86)return'Снег';if(x>=95)return'Гроза';return'–'}
 if(/thunder/.test(x))return'Гроза';if(/snow|sleet/.test(x))return'Снег';if(/rain|shower/.test(x))return'Дождь';if(/fog/.test(x))return'Туман';if(/partlycloudy/.test(x))return'Перем. облачность';if(/fair/.test(x))return'Малооблачно';if(/clearsky/.test(x))return'Ясно';if(/cloudy/.test(x))return'Пасмурно';return'–'}
// ---- загрузка
async function loadMet(){
 const j=await get(`https://api.met.no/weatherapi/locationforecast/2.0/complete?lat=${L.lat}&lon=${L.lon}`);
 return j.properties.timeseries.map(x=>{const d=x.data.instant.details,n=x.data.next_1_hours||x.data.next_6_hours||{};
  return{t:new Date(x.time),temp:d.air_temperature,wind:d.wind_speed,dir:d.wind_from_direction,gust:null,hum:d.relative_humidity,pres:d.air_pressure_at_sea_level,c:cond(n.summary&&n.summary.symbol_code)}})}
const MODELS=['ecmwf_ifs025','gfs_seamless','icon_seamless','jma_seamless','meteofrance_seamless','cma_grapes_global','gem_seamless'];
const VARS=['temperature_2m','wind_speed_10m','wind_direction_10m','wind_gusts_10m','relative_humidity_2m','pressure_msl','weather_code'];
async function loadOm(){
 const j=await get(`https://api.open-meteo.com/v1/forecast?latitude=${L.lat}&longitude=${L.lon}&hourly=${VARS.join()}&models=${MODELS.join()}&wind_speed_unit=ms&forecast_days=8&timezone=Asia%2FVladivostok`);
 const h=j.hourly,col=(v,i)=>MODELS.map(m=>h[v+'_'+m]&&h[v+'_'+m][i]).filter(x=>x!=null);
 return h.time.map((s,i)=>({t:new Date(s+':00+10:00'),temp:trim(col('temperature_2m',i)),wind:trim(col('wind_speed_10m',i)),dir:cmean(col('wind_direction_10m',i)),gust:trim(col('wind_gusts_10m',i)),hum:trim(col('relative_humidity_2m',i)),pres:trim(col('pressure_msl',i)),c:cond(mode(col('weather_code',i)))}))}
async function loadSea(){
 const j=await get(`https://marine-api.open-meteo.com/v1/marine?latitude=${L.lat}&longitude=${L.lon}&hourly=wave_height,wave_period,wave_direction,sea_surface_temperature&timezone=Asia%2FVladivostok&forecast_days=3`);
 const h=j.hourly;return h.time.map((s,i)=>({t:new Date(s+':00+10:00'),h:h.wave_height[i],p:h.wave_period[i],d:h.wave_direction[i],w:h.sea_surface_temperature[i]}))}
async function loadKp(){
 let j;try{j=await get('https://services.swpc.noaa.gov/products/noaa-planetary-k-index-forecast.json')}catch(e){j=await get('https://services.swpc.noaa.gov/products/noaa-planetary-k-index.json')}
 return j.map(x=>Array.isArray(x)?{t:x[0],k:x[1]}:{t:x.time_tag,k:x.kp}).filter(x=>x.t&&/^\d/.test(x.t)&&!isNaN(parseFloat(x.k))).map(x=>({t:new Date(x.t.replace(' ','T').replace(/Z?$/,'Z')),k:parseFloat(x.k)}))}
// ---- состояние
let W=null,SEA=null,KP=null,SRC=cfg.src,AT=0,busy=false;
const rev=a=>a&&a.map(x=>({...x,t:new Date(x.t)}));
async function refresh(){
 if(busy)return;busy=true;$('#st').textContent='Обновление…';
 if(!W){const c=ls.g(`wx:${LK}:${cfg.src}`,null);if(c){W=rev(c.d);SRC=cfg.src;AT=c.at;SEA=rev(ls.g('sea:'+LK,null));KP=rev(ls.g('mag',null));draw()}}
 const ps=loadSea(),pk=loadKp();let ok=false;
 for(const f of cfg.src==='om'?[loadOm,loadMet]:[loadMet,loadOm]){
  try{const d=await f();SRC=f===loadOm?'om':'met';ls.s(`wx:${LK}:${SRC}`,{d,at:Date.now()});W=d;AT=Date.now();ok=true;break}catch(e){}}
 try{SEA=await ps;ls.s('sea:'+LK,SEA)}catch(e){}
 try{KP=await pk;ls.s('mag',KP)}catch(e){}
 busy=false;draw();
 $('#st').textContent=ok?`Обновлено ${hh(new Date(AT))}:${String(lt(new Date(AT)).getUTCMinutes()).padStart(2,'0')} · ${SRC==='om'?'Open-Meteo':'MET Norway'}`:(W?'Нет связи: показаны сохранённые данные':'Нет связи и нет сохранённых данных')}
// ---- отрисовка
function tbl(h,rows){return`<table><tr>${h.map(x=>`<th>${x}</th>`).join('')}</tr>${rows.join('')}</table>`}
function draw(){
 $('#ttl').textContent=L.n;
 $('#locs').innerHTML=Object.keys(LOCS).map(k=>`<button class="${k===LK?'on':''}" onclick="location.href='forecast.html'+('${k}'==='vl'?'':'?loc=${k}')">${LOCS[k].n}</button>`).join('');
 if(!W){return}
 const now=Date.now(),cur=[...W].reverse().find(x=>x.t.getTime()<=now)||W[0];
 const fut=W.filter(x=>x.t.getTime()>now),hasG=W.some(x=>x.gust!=null);
 const kpNow=KP&&([...KP].reverse().find(x=>x.t.getTime()<=now)||{}).k,kpMax=KP&&Math.max(0,...KP.filter(x=>x.t.getTime()>now-108e5&&x.t.getTime()<now+864e5*3).map(x=>x.k));
 let al=[];
 if(cfg.warn){
  const w24=Math.max(0,...fut.filter(x=>x.t.getTime()<now+864e5).map(x=>Math.max(x.wind||0,x.gust||0)));
  if(w24>=cfg.thr+5)al.push(['bad',`Штормовой ветер до ${r(w24)} м/с`]);else if(w24>=cfg.thr)al.push(['',`Сильный ветер до ${r(w24)} м/с`]);
  if(fut.some(x=>x.t.getTime()<now+864e5&&x.c==='Гроза'))al.push(['bad','Возможна гроза']);
  const wv=SEA&&Math.max(0,...SEA.filter(x=>x.t.getTime()>now&&x.t.getTime()<now+1728e5).map(x=>x.h||0));
  if(wv>=2)al.push(['',`Сильное волнение: волна до ${r(wv,1)} м`]);
  if(kpMax>=5)al.push(['bad',`Магнитная буря: Kp до ${r(kpMax,1)}`])}
 let h=al.map(a=>`<div class="alert ${a[0]}">${a[1]}</div>`).join('');
 h+=`<section><div class="big">${r(cur.temp)}°</div><div>${cur.c}</div><div class="mut">Ветер ${dirT(cur.dir)} ${r(cur.wind,1)} м/с${cur.gust!=null?`, порывы ${r(cur.gust,1)}`:''} · влажность ${r(cur.hum)}% · ${cur.pres!=null?r(cur.pres*(SRC==='om'?0.750062:0.750062)):'–'} мм рт. ст.${kpNow!=null?` · Kp ${r(kpNow,1)}`:''}</div></section>`;
 const win=[];for(let i=0;i<24&&i<fut.length;i+=2){const g=fut.slice(i,i+2);if(!g.length)break;
  win.push(`<tr><td>${hh(g[0].t)}–${hh(new Date(g[0].t.getTime()+72e5))}</td><td>${r(mean(g.map(x=>x.temp)))}°</td><td>${g[0].c}</td><td>${dirT(g[0].dir)} ${r(Math.max(...g.map(x=>x.wind||0)),1)}</td>${hasG?`<td>${r(Math.max(...g.map(x=>x.gust||0)),1)}</td>`:''}</tr>`)}
 h+=`<section><h2>Сутки по окнам</h2>${tbl(['Время','t','Погода','Ветер м/с'].concat(hasG?['Порыв']:[]),win)}</section>`;
 const days={};fut.forEach(x=>{if(+hh(x.t)%3===0)(days[dk(x.t)]=days[dk(x.t)]||[]).push(x)});
 h+=Object.keys(days).slice(0,3).map(k=>`<section><h2>${dl(days[k][0].t)}</h2>${tbl(['Час','t','Погода','Ветер м/с'].concat(hasG?['Порыв']:[]),days[k].map(x=>`<tr><td>${hh(x.t)}</td><td>${r(x.temp)}°</td><td>${x.c}</td><td>${dirT(x.dir)} ${r(x.wind,1)}</td>${hasG?`<td>${r(x.gust,1)}</td>`:''}</tr>`))}</section>`).join('');
 const wk={};W.forEach(x=>(wk[dk(x.t)]=wk[dk(x.t)]||[]).push(x));
 h+=`<section><h2>Неделя</h2>${tbl(['День','Мин','Макс','Погода','Ветер м/с'],Object.keys(wk).slice(0,7).map(k=>{const a=wk[k],m=a.find(x=>+hh(x.t)>=12)||a[0];return`<tr><td>${dl(a[0].t)}</td><td>${r(Math.min(...a.map(x=>x.temp)))}°</td><td>${r(Math.max(...a.map(x=>x.temp)))}°</td><td>${m.c}</td><td>${r(Math.max(...a.map(x=>x.wind||0)),1)}</td></tr>`}))}</section>`;
 if(KP){const ks=KP.filter(x=>x.t.getTime()>now-108e5&&x.t.getTime()<now+864e5*3);
  h+=`<section><h2>Магнитное поле</h2><div>Сейчас Kp ${r(kpNow,1)} · максимум впереди ${r(kpMax,1)} · ${kpMax>=9?'G5':kpMax>=8?'G4':kpMax>=7?'G3':kpMax>=6?'G2':kpMax>=5?'G1':'бури нет'}</div><div class="kp">${ks.map(x=>`<i class="${x.k>=5?'bad':x.k>=4?'warn':''}" style="height:${Math.max(6,x.k*11)}%" title="${dl(x.t)} ${hh(x.t)}:00 · Kp ${x.k}"></i>`).join('')}</div><div class="mut">Столбики по 3 часа, ближайшие 3 суток, время местное.</div></section>`}
 if(SEA){const s=SEA.filter(x=>x.t.getTime()>now&&+hh(x.t)%3===0&&x.t.getTime()<now+1728e5),c=SEA.find(x=>x.t.getTime()>now)||{};
  if(s.length)h+=`<section><h2>Море</h2><div>Волна ${r(c.h,1)} м, период ${r(c.p)} с, ${dirT(c.d)} · вода ${c.w!=null?r(c.w,1)+'°':'–'}</div>${tbl(['Время','Волна м','Период с','Напр.'],s.map(x=>`<tr><td>${dl(x.t)} ${hh(x.t)}</td><td class="${x.h>=2?'bad':x.h>=1?'warn':''}">${r(x.h,1)}</td><td>${r(x.p)}</td><td>${dirT(x.d)}</td></tr>`))}</section>`}
 $('#app').innerHTML=h}
// ---- настройки
function save(){ls.s('cfg',cfg);if(B&&B.setNotifyConfig)try{B.setNotifyConfig(cfg.ne,cfg.nh,cfg.nm)}catch(e){}}
function openSet(){const p=n=>String(n).padStart(2,'0');
 $('#dlg').innerHTML=`<h2>Настройки</h2>
 <label>Источник прогноза<select id="s1"><option value="met">MET Norway</option><option value="om">Open-Meteo</option></select></label>
 <label>Предупреждения<input id="s2" type="checkbox" ${cfg.warn?'checked':''}></label>
 <label>Порог ветра, м/с<input id="s3" type="number" min="5" max="40" value="${cfg.thr}" style="width:80px"></label>
 <label>Утреннее уведомление<input id="s4" type="checkbox" ${cfg.ne?'checked':''}></label>
 <label>Время<input id="s5" type="time" value="${p(cfg.nh)}:${p(cfg.nm)}"></label>
 <div><button id="b1">Проверить уведомление</button><button id="b2">Разрешить уведомления</button><button id="b3">Точные будильники</button><button id="b4">Очистить сохранённые данные</button></div>
 <p class="mut">Страница v${PAGE_V}${B&&B.appVersion?' · приложение '+B.appVersion():''}</p><button id="b5" class="on">Закрыть</button>`;
 $('#s1').value=cfg.src;$('#ov').classList.add('show');
 $('#s1').onchange=e=>{cfg.src=e.target.value;save();W=null;refresh()};
 $('#s2').onchange=e=>{cfg.warn=e.target.checked;save();draw()};
 $('#s3').onchange=e=>{cfg.thr=+e.target.value||15;save();draw()};
 $('#s4').onchange=e=>{cfg.ne=e.target.checked;save()};
 $('#s5').onchange=e=>{const v=e.target.value.split(':');cfg.nh=+v[0];cfg.nm=+v[1];save()};
 $('#b1').onclick=()=>B&&B.testNotification&&B.testNotification();
 $('#b2').onclick=()=>B&&B.openNotifSettings&&B.openNotifSettings();
 $('#b3').onclick=()=>B&&B.openAlarmSettings&&B.openAlarmSettings();
 $('#b4').onclick=()=>{Object.keys(localStorage).filter(k=>/^(wx:|sea:|mag)/.test(k)).forEach(k=>localStorage.removeItem(k));W=SEA=KP=null;$('#app').innerHTML='';refresh()};
 $('#b5').onclick=()=>$('#ov').classList.remove('show')}
$('#gear').onclick=openSet;
let ty=null;
addEventListener('touchstart',e=>{ty=scrollY===0?e.touches[0].clientY:null},{passive:true});
addEventListener('touchend',e=>{if(ty!=null&&e.changedTouches[0].clientY-ty>90)refresh();ty=null},{passive:true});
document.addEventListener('visibilitychange',()=>{if(!document.hidden&&Date.now()-AT>6e5)refresh()});
save();draw();refresh();
</script></body></html>
